<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="128"
   height="128"
   viewBox="0 0 128 128"
   version="1.1"
   id="svg1"
   sodipodi:docname="ingecad.svg"
   inkscape:version="1.4.3 (0d15f75042, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="0.54966504"
     inkscape:cx="691.33013"
     inkscape:cy="460.28032"
     inkscape:window-width="1920"
     inkscape:window-height="1043"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="g8" />
  <!-- IngeCAD application icon.
       SPDX-License-Identifier: GPL-3.0-or-later
       Copyright (C) 2026 Marco Sumari Tellez and IngeCAD contributors.

       The scene is a model-space viewport: dark background with the drafting
       grid, the UCS icon (X red, Y green, as in AutoCAD) and the crosshair
       cursor with its pick box sitting in the first quadrant.

       KEEP THIS COMMENT INSIDE <svg>. A comment between the XML declaration
       and the root tag breaks gdk-pixbuf/librsvg format sniffing, and GNOME
       Shell then draws a blank grey square in the dock.

       This file is the single source of truth. After editing it, regenerate the
       derived rasters IN THIS ORDER — the document icons composite
       ingecad_256.png as their badge, so they must come second:
         python scripts/gen_app_icons.py        -> resources/icons/*.png + .ico
         python scripts/gen_doc_icons.py        -> .dwg/.dxf document icons
         python web/tools/gen-images.py         -> the site logo, favicons, OG
       and then scripts/install-desktop.sh to put them in the icon theme. -->
  <defs
     id="defs2">
    <linearGradient
       id="bg"
       x1="0"
       y1="0"
       x2="0"
       y2="1">
      <stop
         offset="0"
         stop-color="#273445"
         id="stop1" />
      <stop
         offset="1"
         stop-color="#171b21"
         id="stop2" />
    </linearGradient>
    <clipPath
       id="tile">
      <rect
         x="8"
         y="8"
         width="112"
         height="112"
         rx="24"
         id="rect2" />
    </clipPath>
  </defs>
  <rect
     x="8"
     y="8"
     width="112"
     height="112"
     rx="24"
     fill="url(#bg)"
     id="rect3" />
  <g
     clip-path="url(#tile)"
     id="g6">
    <!-- drafting grid (minor lines, faint like the model-space GRID) -->
    <g
       stroke="#2e3540"
       stroke-width="1"
       id="g4">
      <path
         d="M24 8V120 M40 8V120 M56 8V120 M72 8V120 M88 8V120 M104 8V120"
         id="path3" />
      <path
         d="M8 24H120 M8 40H120 M8 56H120 M8 72H120 M8 88H120 M8 104H120"
         id="path4" />
    </g>
    <!-- brighter major lines every 5th -->
    <g
       stroke="#3a4250"
       stroke-width="1"
       id="g5">
      <path
         d="M8 88H120 M40 8V120"
         id="path5" />
    </g>
  </g>
  <!-- Crosshair cursor filling the first quadrant: four arms, the pick box, and
       the solid centre dot. Three things about the numbers, all of which cost a
       render to find out:
         - the box is centred on (80,48) and ~20 px wide, so its strokes land ON
           the grid lines at 72/88 and 40/56 and hide them. Any other size and
           the grid shows through the hollow box as a "#", which reads as
           hatching rather than as a cursor.
         - the arms keep an ~11 px gap around the centre. Close it and the
           square stops being a recognisable hole below 48 px.
         - the arms deliberately run right up to the two axes (x 37.5 is the
           green axis's edge, y 90.2 the red one's), which is what makes the
           cursor read as sitting IN the drawing rather than floating over it.
       Drawn before the UCS icon so the axes stay the strongest shape. -->
  <g
     stroke="#e8eaed"
     stroke-width="4"
     stroke-linecap="butt"
     fill="none"
     id="g8">
    <path
       d="m 37.539084,48 h 30.959901 m 22.888325,0 h 26.29797"
       id="path9"
       style="stroke-width:4.47622"
       sodipodi:nodetypes="cccc" />
    <path
       d="M 80,9.6324857 V 36.079695 m 0,23.840609 v 30.313201"
       id="path10"
       style="stroke-width:4.4889"
       sodipodi:nodetypes="cccc" />
    <rect
       x="70.15844"
       y="38.087353"
       width="19.747105"
       height="19.947109"
       stroke-width="4.25289"
       id="rect9" />
    <path
       style="fill:#e8eaed;fill-opacity:1;stroke:#e8eaed;stroke-width:0.113706;stroke-dasharray:none;stroke-opacity:1"
       d="m 78.00205,47.949249 v -1.989848 h 1.975635 1.975635 v 1.989848 1.989848 H 79.977685 78.00205 Z"
       id="path1" />
  </g>
  <!-- UCS axes: X red, Y green (AutoCAD colors), arrowheads -->
  <g
     stroke-linecap="round"
     id="g7">
    <line
       x1="34"
       y1="94"
       x2="98"
       y2="94"
       stroke="#c6262e"
       stroke-width="7"
       id="line6" />
    <line
       x1="34"
       y1="94"
       x2="34"
       y2="32"
       stroke="#68b723"
       stroke-width="7"
       id="line7" />
  </g>
  <path
     d="M96 85 L114 94 L96 103 Z"
     fill="#c6262e"
     id="path7" />
  <path
     d="M25 34 L34 16 L43 34 Z"
     fill="#68b723"
     id="path8" />
  <!-- origin joint -->
  <rect
     x="29"
     y="89"
     width="10"
     height="10"
     rx="2"
     fill="#e8eaed"
     id="rect8" />
  <!-- subtle tile edge -->
  <rect
     x="8.5"
     y="8.5"
     width="111"
     height="111"
     rx="23.5"
     fill="none"
     stroke="#000000"
     stroke-opacity="0.45"
     id="rect11" />
  <rect
     x="9.5"
     y="9.5"
     width="109"
     height="109"
     rx="22.5"
     fill="none"
     stroke="#ffffff"
     stroke-opacity="0.05"
     id="rect12" />
</svg>
