# SPDX-License-Identifier: GPL-3.0-or-later
# Build the Linux AppImage on a tag and attach it to the release.
#
# Runs on ubuntu-22.04 on purpose: an AppImage links against the glibc of the
# machine that built it, so building on the newest runner would produce a file
# that only starts on the newest distros. 22.04 covers 22.04, 24.04 and 26.04.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # so the pipeline can be exercised without a tag

permissions:
  contents: write           # to upload the asset to the release

jobs:
  appimage:
    name: AppImage (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"     # the oldest we support; the AppImage carries it

      - name: System packages
        run: |
          sudo apt-get update -qq
          # libegl/libgl for Qt, fuse for appimagetool, xvfb for the smoke test
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libfuse2 xvfb

      - name: Python dependencies
        run: |
          python -m venv venv
          ./venv/bin/python -m pip install --quiet --upgrade pip
          ./venv/bin/python -m pip install --quiet -r requirements.txt pyinstaller

      # vendor/libredwg is gitignored, so a fresh clone has no converters.
      # This rebuilds them from the pristine release plus the shipped patches.
      - name: Build vendor/libredwg
        run: tools/libredwg-patches/build-vendor.sh

      - name: Tests
        run: ./venv/bin/python -m pytest -q

      - name: Build the AppImage
        run: packaging/build-appimage.sh dist

      # build-appimage.sh already ran --check on the bundle and on the
      # AppImage. This is the harder question: does it start a real GUI and
      # open a drawing? xvfb gives it a display; ezdxf writes the test DXF.
      - name: Smoke test with a display
        run: |
          ./venv/bin/python - <<'PY'
          import ezdxf
          doc = ezdxf.new("R2000")
          ms = doc.modelspace()
          ms.add_line((0, 0), (100, 50))
          ms.add_circle((50, 25), 12.5)
          doc.saveas("smoke.dxf")
          PY
          APP=$(ls dist/IngeCAD-*-x86_64.AppImage)
          # It has no --exit-after, so give it a few seconds and require that it
          # was still alive: a crash on startup exits well before the timeout.
          set +e
          xvfb-run -a timeout 25 "$APP" smoke.dxf > smoke.log 2>&1
          rc=$?
          set -e
          cat smoke.log
          if [ "$rc" != "124" ]; then
            echo "!! the AppImage exited with $rc instead of surviving to the timeout"
            exit 1
          fi
          echo "OK — started, opened smoke.dxf and stayed up"

      # The tarball is the same bundle without the AppImage wrapper. Prove it
      # runs after extraction, not just that it was packed.
      - name: Smoke test the tarball
        run: |
          mkdir -p tarcheck && tar -C tarcheck -xzf dist/IngeCAD-*-linux-x86_64.tar.gz
          tarcheck/IngeCAD-*/ingecad --check

      - uses: actions/upload-artifact@v4
        with:
          name: IngeCAD-AppImage-x86_64
          path: dist/IngeCAD-*-x86_64.AppImage
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: IngeCAD-tarball-x86_64
          path: dist/IngeCAD-*-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v0.4.1 tripped here: upload requires the release to EXIST, and
          # earlier releases had been created by hand first. Create it from
          # the tag when missing (draft notes; the human prose is edited on
          # the release page afterwards), then upload.
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --title "IngeCAD ${GITHUB_REF_NAME#v}" \
              --notes "See CHANGELOG.md for this release's details."
          gh release upload "${GITHUB_REF_NAME}" \
            dist/IngeCAD-*-x86_64.AppImage \
            dist/IngeCAD-*-linux-x86_64.tar.gz --clobber

  snap:
    name: Snap (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential file libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-render-util0

      - name: Python dependencies
        run: |
          python -m venv venv
          ./venv/bin/python -m pip install --quiet --upgrade pip
          ./venv/bin/python -m pip install --quiet -r requirements.txt pyinstaller

      - name: Build vendor/libredwg
        run: tools/libredwg-patches/build-vendor.sh

      - name: Build the PyInstaller bundle
        run: |
          INGECAD_ROOT="$PWD" ./venv/bin/python -m PyInstaller --noconfirm \
            --distpath dist-pyi --workpath build-pyi packaging/ingecad.spec
          dist-pyi/ingecad/ingecad --check

      - name: Stage the snap tree
        run: |
          VERSION=$(./venv/bin/python -c 'from core.version import __version__; print(__version__)')
          mkdir -p build/snap-stage/snap/gui build/snap-stage/payload
          sed "s/@VERSION@/$VERSION/" packaging/snap/snapcraft.yaml.in \
            > build/snap-stage/snap/snapcraft.yaml
          cp -a dist-pyi/ingecad/. build/snap-stage/payload/
          cp resources/icons/ingecad_256.png build/snap-stage/snap/gui/ingecad.png
          sed -e 's|^Exec=.*|Exec=ingecad %f|' \
              -e 's|^Icon=.*|Icon=${SNAP}/meta/gui/ingecad.png|' \
              packaging/flatpak/org.ingecad.IngeCAD.desktop \
              > build/snap-stage/snap/gui/ingecad.desktop

      - name: Build the snap
        id: snapbuild
        uses: snapcore/action-build@v1
        with:
          path: build/snap-stage

      - name: Smoke test the snap
        run: |
          sudo snap install --dangerous "${{ steps.snapbuild.outputs.snap }}"
          snap run ingecad --check

      - uses: actions/upload-artifact@v4
        with:
          name: IngeCAD-snap-x86_64
          path: ${{ steps.snapbuild.outputs.snap }}
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --title "IngeCAD ${GITHUB_REF_NAME#v}" \
              --notes "See CHANGELOG.md for this release's details."
          gh release upload "${GITHUB_REF_NAME}" "${{ steps.snapbuild.outputs.snap }}" --clobber

      - name: Publish to the Snap Store (if credentials exist)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "Sin SNAPCRAFT_STORE_CREDENTIALS — se omite la publicación."
            exit 0
          fi
          sudo snap install snapcraft --classic
          snapcraft upload "${{ steps.snapbuild.outputs.snap }}" --release=stable
