name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Xvfb + xcb instead of the offscreen platform. Offscreen degrades
      # QOpenGLWidget to a plain widget ("not supported on this platform")
      # and the window-heavy tests kept crashing the interpreter around
      # that degradation -- an exit-time double free one run, a mid-run
      # segfault in processEvents the next, all after every test passed.
      # Under a real X server Qt runs the same code paths the application
      # runs on the user's desktop, GL included (Mesa's llvmpipe).
      - name: System libraries for Xvfb + Qt/OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libegl1 libopengl0 libgl1 libgl1-mesa-dri \
            libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxcb-cursor0
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s "-screen 0 1600x1000x24" pytest tests/ -q
