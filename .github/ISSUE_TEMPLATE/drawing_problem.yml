name: A drawing opens, prints or saves wrong
description: A DWG or DXF that IngeCAD reads, draws or writes differently than it should.
title: "[drawing] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Escribe en español si prefieres** — English or Spanish, both are read.

        This is the most valuable kind of report for IngeCAD, and also the one
        that is impossible to act on without the file. Please read the note
        about that below.
  - type: textarea
    id: what
    attributes:
      label: What goes wrong
      description: What you see, and what you expected instead.
      placeholder: |
        The hatch inside the walls is missing, and the block with the north
        arrow comes in rotated. In AutoCAD the same file looks right.
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: The drawing
      description: |
        **Attach it if you can** (drag it here; zip it if GitHub refuses the
        extension). Without the file this usually cannot be fixed.

        Client work is understood. If you cannot share it: say so, and send
        whatever you can instead — a screenshot, or a copy with only the
        entities that misbehave left in it. A drawing that reproduces the
        problem with ten lines is worth more than the real one anyway.
      placeholder: attached / cannot share, here is a screenshot instead
    validations:
      required: true
  - type: input
    id: origin
    attributes:
      label: What made the drawing
      description: The program and version that wrote it, if you know.
      placeholder: AutoCAD 2018, Civil 3D 2020, BricsCAD V24, a surveyor sent it…
  - type: input
    id: version
    attributes:
      label: IngeCAD version
      description: Help ▸ About, or run `ingecad --check` and paste the first line.
      placeholder: 0.4.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - AppImage
        - tar.gz
        - from the repository (python main.py)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Distribution, and whether the session is Wayland or X11.
      placeholder: Ubuntu 24.04, Wayland
