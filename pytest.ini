[pytest]
# A test that has not finished after two minutes dumps every thread's stack
# (pytest's faulthandler plugin) and keeps going: a hang that shows up once
# in eight runs -- one did, 2026-10-09, four suite processes at once --
# then leaves the stack that names it instead of a silent stuck process.
faulthandler_timeout = 120
